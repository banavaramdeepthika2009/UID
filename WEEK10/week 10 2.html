<!DOCTYPE html>
<html>
<head>
    <script>
        function sortNumbers(){
            const array = [];
            let i = 1;

            while(i <= 5){
                let num = parseInt(prompt("Enter a number:"));
                array.push(num);
                i++;
            }

            
            for(let i = 0; i < array.length - 1; i++){
                for(let j = 0; j < array.length - 1 - i; j++){
                    if(array[j] > array[j + 1]){
                        let temp = array[j];
                        array[j] = array[j + 1];
                        array[j + 1] = temp;
                    }
                }
            }

            document.write("Sorted Array: " + array);
        }

        sortNumbers();
    </script>
</head>
</html>
