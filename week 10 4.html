        <script>
            function num(){
                let i=0;
                while(i<=15){
                    if(i==0){
                        document.write(i+"is even <br>");

                    }
                    else if (i%2==0){
                        document.write(i+"is even <br>");
                    }else{
                        document.write(i+" is odd <br>")
                        
                    }i++

                }
                
            }
            num();
