<!DOCTYPE html>
<html>
<body>
<script>
    function prime(){
        let a = parseInt(prompt("Enter a number"));

if (a <= 1) {
    document.write("Not a prime number");
}
else if (a == 2 || a == 3 || a == 5 || a == 7) {
    document.write("Prime number");
}
else if (a % 2 == 0 || a % 3 == 0 || a % 5 == 0 || a % 7 == 0) {
    document.write("Not a prime number");
}
else {
    document.write("Prime number");
}

    }
    prime()

</script>
</body>
</html>
