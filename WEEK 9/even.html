<!DOCTYPE html>
<html>
    <head>
        <body>
            
            <script>
                function even(){
                    let a=parseInt(prompt("enter a number"));
                
                if(a%2==0){
                    document.write(a+"is a even number")

                }else{
                    document.write(a+"is a odd number")
                }

                }
                even()

                
            </script>
        </body>
    </head>
</html>
